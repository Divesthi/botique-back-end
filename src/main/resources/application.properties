spring.application.name=bqom

#database configurations
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bqom}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:welcome123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

#jpa configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Logging configuration
logging.level.root=WARN
logging.level.liquibase=INFO
logging.level.org.springframework.boot=INFO
#logging.file.name=myapp.log

#liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
#spring.liquibase.drop-first=true

#Database backup configuration
backup.directory=./backups
backup.retention.days=30
backup.pgdump.path=pg_dump

#Supabase configuration
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:your-supabase-jwt-secret-here}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key-here}
supabase.anon.key=${SUPABASE_ANON_KEY:your-anon-key-here}

#Encryption configuration
encryption.key=${ENCRYPTION_KEY:encryption-key}

#Instagram OAuth Configuration
instagram.app-id=${INSTAGRAM_APP_ID:instagram-app-id}
instagram.app-secret=${INSTAGRAM_APP_SECRET:instagram-app-secret}
instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:http://localhost:8080/v1/bqom/instagram/callback}
#Expected: https://botique-back-end.onrender.com/v1/bqom/instagram/callback
instagram.frontend-base-url=${INSTAGRAM_FRONTEND_BASE_URL:http://localhost:5173}
#Expected: https://botique-front-end.onrender.com
instagram.state-token-expiry-minutes=10
instagram.token-refresh-threshold-days=10
instagram.graph-api-version=v19.0

#ImgBB Image Hosting
#API key from https://imgbb.com - Account - API - Add API key
imgbb.api-key=${IMGBB_API_KEY:imgbb-api-key}

#ImgBB upload endpoint ? do not change unless testing against a mock
imgbb.upload-url=https://api.imgbb.com/1/upload

#How long (in seconds) ImgBB should retain the hosted image.
#Meta fetches the image during container creation (usually within minutes).
#3600 = 1 hour is sufficient and avoids permanent storage of customer images.
#Set to 0 for permanent retention.
imgbb.expiration-seconds=3600

#Maximum allowed file size per image in bytes (default: 10MB)
imgbb.max-file-size-bytes=10485760

#Maximum images per post request (Meta Carousel max = 10)
imgbb.max-images-per-post=10

#Meta Graph API (Instagram Content Publishing)
#Base URL for Meta Graph API - override for integration testing against mocks
bqom.instagram.graph-api-url=https://graph.facebook.com

#Async Task Executor
#These settings tune the thread pool used by @Async for Instagram publishing.
#Tune based on your expected concurrent post volume.
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ig-post-

#Multipart Upload Limits
#Allow up to 10 images � 10MB each = 100MB per request.
#Adjust based on your expected image sizes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Google AI Studio API key - MUST be set via GEMINI_API_KEY environment variable
# Never hardcode this value. Generate a key at: https://aistudio.google.com/app/apikey
gemini.api-key=${GEMINI_API_KEY:gemini-api-key}
# Gemini model ? gemini-1.5-flash is fastest and lowest cost for caption generation
# Options: gemini-1.5-flash (default), gemini-1.5-pro (higher quality, slower, costs more)
gemini.model=gemini-2.5-flash
# Base URL for the Google Generative AI REST API (do not change unless testing)
gemini.api-base-url=https://generativelanguage.googleapis.com
# Maximum tokens in Gemini's response (caption + 5 hashtags fits in ~150 tokens)
# Keeping this low reduces latency and cost. Range: 50?500.
gemini.max-output-tokens=300
# Temperature controls caption creativity. 0.7 = professional but varied.
# Range: 0.0 (deterministic/repetitive) ? 1.0 (very creative/unpredictable)
gemini.temperature=0.7
# HTTP timeout for Gemini API ? image upload + analysis takes longer than pure text APIs
gemini.connect-timeout-seconds=10
gemini.read-timeout-seconds=20
# Maximum image size to send to Gemini (4MB default).
# Images above this limit skip caption generation (post proceeds without caption).
# Must be <= 10485760 (10MB)
gemini.max-image-size-bytes=4194304
