spring.application.name=bqom

#database configurations
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bqom}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:welcome123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

#jpa configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Logging configuration
logging.level.root=WARN
logging.level.liquibase=INFO
logging.level.org.springframework.boot=INFO
#logging.file.name=myapp.log

#liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
#spring.liquibase.drop-first=true

#Database backup configuration
backup.directory=./backups
backup.retention.days=30
backup.pgdump.path=pg_dump

#Supabase configuration
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:your-supabase-jwt-secret-here}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key-here}
supabase.anon.key=${SUPABASE_ANON_KEY:your-anon-key-here}

#Encryption configuration
encryption.key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
